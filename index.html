<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRent AI | Decision Engine</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 pb-20">

    <div id="frontPage" class="max-w-md mx-auto space-y-6">
        <header class="py-6">
            <h1 class="text-4xl font-black text-slate-900 tracking-tighter">SmartRent <span class="text-blue-600">AI</span></h1>
            <p class="text-slate-500 font-bold text-sm uppercase tracking-wider">Decision Intelligence Engine</p>
        </header>

        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase">Monthly Salary</label>
                    <input id="salary" type="number" class="input-field" placeholder="5000">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase">Fixed Commits</label>
                    <input id="commitments" type="number" class="input-field" placeholder="1200">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase">Depo Budget</label>
                    <input id="deposit_budget" type="number" class="input-field" placeholder="1000">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase">Transport</label>
                    <select id="transport_mode" class="input-field">
                        <option value="Car">Car</option>
                        <option value="Public Transport">Public Transport</option>
                        <option value="Walk">Walk</option>
                    </select>
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-black text-slate-400 uppercase">Workplace (Area)</label>
                <input id="workplace" type="text" class="input-field" placeholder="TRX, Kuala Lumpur">
            </div>

            <div class="pt-4 border-t border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Rental Ads (Max 5)</label>
                    <button onclick="addRentalAd()" class="text-blue-600 font-black text-xs hover:underline">+ Add Ad</button>
                </div>
                <div id="ads-dynamic-list" class="space-y-2">
                    <div class="ad-entry flex items-center gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <span class="text-[12px] font-black text-slate-400 w-8">#01</span>
                        <input class="ad-input flex-1 border-none bg-transparent outline-none text-sm font-bold text-slate-700" placeholder="Paste details here...">
                    </div>
                </div>
            </div>
        </div>

        <button onclick="runSmartAnalysis()" class="btn-primary w-full py-5 bg-blue-600 text-white rounded-[2rem] font-black text-lg shadow-xl shadow-blue-100 active:scale-95">
            CALCULATE INTELLIGENCE
        </button>
    </div>

    <div id="loadingOverlay" style="display:none;" class="fixed inset-0 bg-white/90 backdrop-blur-md z-[200] flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="font-black text-slate-800 tracking-tight">Z.AI is analyzing your COL data...</p>
    </div>

    <div id="resultOverlay" style="display:none;" class="fixed inset-0 bg-white z-[100] flex flex-col">
        <nav class="p-4 flex items-center border-b border-slate-100 bg-white">
            <button onclick="closeResults()" class="bg-slate-100 px-6 py-2 rounded-full font-black text-xs text-slate-600 active:scale-90 transition-all uppercase">← Back to Inputs</button>
        </nav>
        
        <div id="resultsContainer" class="flex-1 overflow-y-auto p-4 bg-slate-50">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
