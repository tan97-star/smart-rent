<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRent AI | Decision Intelligence Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f5f7fb] antialiased p-4 pb-24">
    <div class="bg-glow"></div>

    <div id="frontPage" class="max-w-xl mx-auto space-y-8">
        <header class="py-8 text-center lg:text-left">
            <h1 class="text-5xl font-black text-slate-900 tracking-tighter">
                SmartRent <span class="text-blue-600">AI</span>
            </h1>
            <div class="flex items-center justify-center lg:justify-start gap-3 mt-2">
                <p class="text-slate-400 font-bold text-[10px] uppercase tracking-[0.2em]">Decision Intelligence Engine</p>
                <span class="bg-white border border-slate-200 px-3 py-1 rounded-full text-[9px] font-black shadow-sm">PENGUIN_uUMHACKTHON_2026</span>
            </div>
        </header>

        <div class="space-y-6">
            <div class="card-modern p-6 space-y-5">
                <span class="section-badge">💰 Financial Profile</span>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label>Monthly Salary (RM)</label>
                        <input id="salary" type="number" class="input-field" placeholder="e.g. 5000">
                    </div>
                    <div class="space-y-1">
                        <label>Fixed Commitments</label>
                        <input id="commitments" type="number" class="input-field" placeholder="e.g. 1200">
                    </div>
                </div>
                <div class="space-y-1">
                    <label>Max Deposit Budget</label>
                    <input id="deposit_budget" type="number" class="input-field" placeholder="e.g. 3500">
                </div>
            </div>

            <div class="card-modern p-6 space-y-5">
                <span class="section-badge">🚗 Commute Logistics</span>
                <div class="space-y-1">
                    <label>Workplace (Area)</label>
                    <input id="workplace" type="text" class="input-field" placeholder="e.g. TRX, KLCC">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label>Transport Mode</label>
                        <select id="transport_mode" class="input-field">
                            <option value="Car">🚗 Car / Motor</option>
                            <option value="Public Transport">🚆 Public Transport</option>
                            <option value="Walk">🚶 Walk / Cycle</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label>Max Distance (KM)</label>
                        <input id="max_distance" type="number" class="input-field" placeholder="15" value="15">
                    </div>
                </div>
            </div>

            <div class="card-modern p-6 space-y-4">
                <div class="flex justify-between items-center">
                    <span class="section-badge mb-0">📄 Rental Ads (Max 5)</span>
                    <button onclick="addRentalAd()" class="text-blue-600 font-black text-xs hover:bg-blue-50 px-3 py-1 rounded-full">+ Add Option</button>
                </div>
                <div id="ads-dynamic-list" class="space-y-3">
                    <div class="ad-entry flex items-center gap-3 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <span class="text-[12px] font-black text-slate-400 w-8">#01</span>
                        <input class="ad-input flex-1 border-none bg-transparent outline-none text-sm font-bold text-slate-700" placeholder="Paste link or ad text here...">
                    </div>
                </div>
            </div>
        </div>

        <button onclick="runSmartAnalysis()" class="btn-primary w-full py-6 bg-blue-600 text-white rounded-[2.5rem] font-black text-xl shadow-2xl shadow-blue-200">
            GENERATE INTELLIGENCE
        </button>
    </div>

    <div id="loadingOverlay" style="display:none;" class="fixed inset-0 bg-white/90 backdrop-blur-xl z-[200] flex flex-col items-center justify-center">
        <div class="loader mb-6"></div>
        <p class="font-black text-blue-600 tracking-widest text-sm uppercase animate-pulse">Z.AI Analyzing Financial Impact...</p>
    </div>

    <div id="resultOverlay" style="display:none;" class="fixed inset-0 bg-white z-[100] flex flex-col overflow-hidden">
        <nav class="p-4 flex justify-between items-center border-b border-slate-100 bg-white/80">
            <button onclick="closeResults()" class="bg-slate-100 px-6 py-2 rounded-full font-black text-[10px] text-slate-600 uppercase tracking-wider">← Back</button>
            <button onclick="window.print()" class="bg-emerald-50 text-emerald-600 px-6 py-2 rounded-full font-black text-[10px] uppercase">💾 Export PDF</button>
        </nav>
        <div id="resultsContainer" class="flex-1 overflow-y-auto p-4 md:p-8 bg-[#f8fafc]"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
